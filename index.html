    <script>
        // 基本防盗/防抓取：禁用右键菜单
        document.addEventListener('contextmenu', event => event.preventDefault());
        // 禁用常见的开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || // F12
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || // Ctrl+Shift+I/J/C
               (e.ctrlKey && e.keyCode === 85)) { // Ctrl+U
                e.preventDefault();
            }
        });
    </script>

<body>

<header>
    <a href="#" class="logo"><img src="logo.svg?v=20260320" alt="HavenNest" class="logo-img"><span class="logo-text">HAVENNEST</span><span class="logo-cn">安家居</span></a>
    <div class="lang-toggle" onclick="toggleLang()" id="lang-btn">English / 中文</div>
</header>

<!-- Map Section -->
<div class="map-container">
    <div id="map"></div>
    <div class="map-disclaimer" id="map-notice">
        📍 温馨提示：部分抓取房源因原网站地址信息不全，地图定位可能存在偏差，请以详情页描述为准。
    </div>
</div>

<!-- Service Section -->
<div class="service-center" id="service-ui"></div>

<!-- Filter Bar -->
<div class="filter-bar" id="filter-bar">
    <div class="filter-row primary">
        <button class="filter-toggle" id="filter-toggle" type="button" onclick="toggleFilterPanel()" aria-label="Toggle">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                <path d="M6.293 9.293a1 1 0 0 1 1.414 0L12 13.586l4.293-4.293a1 1 0 1 1 1.414 1.414l-5 5a1 1 0 0 1-1.414 0l-5-5a1 1 0 0 1 0-1.414z" fill="currentColor"></path>
            </svg>
        </button>

        <div class="filter-group">
            <label class="filter-label" id="lbl-city">城市 / City</label>
            <select id="filter-city" class="filter-select" onchange="filterListings()">
                <option value=""></option>
                <option value="Vancouver">Vancouver</option>
                <option value="Richmond">Richmond</option>
                <option value="Burnaby">Burnaby</option>
                <option value="Surrey">Surrey</option>
                <option value="Coquitlam">Coquitlam</option>
            </select>
        </div>

        <div class="filter-group">
            <label class="filter-label" id="lbl-beds">卧室 / Bedrooms</label>
            <select id="filter-beds" class="filter-select" onchange="filterListings()">
                <option value=""></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4+</option>
            </select>
        </div>

        <div class="filter-group">
            <label class="filter-label" id="lbl-budget">预算 / Max Budget</label>
            <select id="filter-budget" class="filter-select" onchange="filterListings()">
                <option value=""></option>
                <option value="2000">$2,000</option>
                <option value="3000">$3,000</option>
                <option value="4000">$4,000</option>
                <option value="5000">$5,000</option>
            </select>
        </div>
    </div>

    <div class="filter-row secondary" id="filter-secondary">
        <div class="filter-group sort-group">
            <label class="filter-label" id="lbl-sort">排序 / Sort</label>
            <select id="sort-price" class="filter-select" onchange="filterListings()">
                <option value="default"></option>
                <option value="low-high"></option>
                <option value="high-low"></option>
                <option value="beds-low-high"></option>
                <option value="beds-high-low"></option>
                <option value="date-new-old"></option>
            </select>
        </div>

        <div class="filter-group view-group">
            <label class="filter-label" id="lbl-view">显示 / View</label>
            <select id="view-mode" class="filter-select" onchange="setViewMode(this.value)">
                <option value="card"></option>
                <option value="compact"></option>
            </select>
        </div>
    </div>
</div>

<!-- Post CTA -->
<div class="post-bar">
    <span id="post-cta-text">拥有空置房源？免费发布至平台 / Have a vacancy?</span>
    <a href="post.html" class="post-btn" id="post-btn-text">屋主发布</a>
    <a href="https://www.singlekey.com/en/tenant-report/how-to-order-a-singlekey-credit-and-background-check-report/" class="post-btn" id="singlekey-btn" target="_blank" rel="noopener noreferrer">SingleKey 背调</a>
</div>

<!-- Listing Grid -->
<div class="grid" id="listing-ui"></div>

<!-- Modals -->
<div id="detailModal" class="modal">
    <div class="modal-content" id="detail-content"></div>
</div>

<div id="svcModal" class="modal">
    <div class="modal-content">
        <span style="position:absolute; top:20px; right:25px; font-size:32px; cursor:pointer; color:#999; z-index:2300;" onclick="closeModal()">×</span>
        
        <div id="step1" class="step">
            <h2 id="m_t1"></h2>
            <div id="m_c1" style="text-align:left; color:#475569; font-size: 1.05rem;"></div>
            <button class="btn-action" id="btn-next" onclick="nextStep(2)"></button>
        </div>

        <div id="step2" class="step">
            <h2 id="m_t2"></h2>
            <p id="m_c2" style="text-align:left; font-size: 1.1rem; line-height: 1.8;"></p>
            <button class="btn-action" id="btn-agree" onclick="nextStep(3)"></button>
        </div>

        <div id="step3" class="step">
            <h2 id="m_t3"></h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <input type="text" id="q_name">
                <input type="tel" id="q_phone">
            </div>
            <input type="email" id="q_email">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <input type="text" id="q_dob">
                <input type="text" id="q_eff_date">
            </div>
            <input type="text" id="q_addr">
            <button class="btn-action" id="btn-gen" onclick="generateOutput()"></button>
        </div>

        <div id="step4" class="step">
            <h2 id="m_t4"></h2>
            <textarea id="outputBox" readonly style="height: 200px; font-family: monospace;"></textarea>
            <div style="display: flex; gap: 15px;">
                <button class="btn-action" id="btn-copy" onclick="copyText()" style="flex: 1;"></button>
                <button class="btn-action" id="btn-email" onclick="openEmail()" style="flex: 1; background: #64748b;"></button>
            </div>
        </div>
    </div>
</div>

<footer>
    <div id="footer-text"></div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
