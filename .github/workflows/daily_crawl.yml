name: Daily Listings Update

on:
  schedule:
    - cron: '0 11 * * *' # 每天凌晨 3 点 (UTC 时间是 11 点)
  workflow_dispatch: # 允许手动触发

jobs:
  update-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper feedparser

      - name: Run crawler
        run: python crawler.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add listings.json coords_cache.json
          git commit -m "Auto-update listings: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
