name: Daily Listings Update

on:
  schedule:
    - cron: '0 11 * * *' # 每天凌晨 3 点 (UTC 时间是 11 点)
  workflow_dispatch: # 允许手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  update-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper feedparser selenium webdriver-manager boto3

      - name: Fetch Rentals.ca (Automated)
        run: python fetch_rentals_selenium.py
        env:
          HAVENNEST_RENTALS_WAIT_SECONDS: "120"
          HAVENNEST_RENTALS_MAX_RETRIES: "2"

      - name: Upload Rentals.ca debug HTML (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rentals-debug-html
          path: |
            rentals_raw_failed.html
            rentals_raw_failed_*.html
          if-no-files-found: ignore

      - name: Run crawler
        run: python crawler.py
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          HAVENNEST_MEDIA_BACKEND: r2
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          HAVENNEST_SKIP_SOURCE_GEOCODE: "1"
          HAVENNEST_GEOCODE_TIMEOUT: "8"
          HAVENNEST_GEOCODE_RETRIES: "1"
          HAVENNEST_GEOCODE_SLEEP: "1.2"
          HAVENNEST_CRAIGSLIST_MODE: "rss"
          HAVENNEST_CRAIGSLIST_LIMIT: "80"
          HAVENNEST_VANPEOPLE_LIMIT: "90"
          HAVENNEST_VANPEOPLE_MAX_PAGES: "6"
 
      - name: Post-crawl fix (city/beds/coords)
        run: python tools/post_crawl_fix.py
        env:
          MAX_GEOCODE: "30"
          MAX_PRIORITY_GEOCODE: "180"
          MAX_BUILDING_GEOCODE: "10"
          MAX_COMMUNITY_GEOBOX: "10"
          COMMUNITY_GEOBOX_SLEEP: "1.2"
          HAVENNEST_GEOCODE_TIMEOUT: "8"
          HAVENNEST_GEOCODE_RETRIES: "1"
          HAVENNEST_GEOCODE_SLEEP: "1.2"

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add listings.json coords_cache.json community_bbox_cache.json building_anchors.json
          git commit -m "Auto-update listings: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
